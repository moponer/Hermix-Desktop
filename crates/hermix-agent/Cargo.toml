[package]
name = "hermix-agent"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Agent loop engine for Hermix Agent"

[dependencies]
hermix-core = { workspace = true }
hermix-config = { workspace = true }
hermix-intelligence = { workspace = true }
hermix-focus = { workspace = true }
hermix-tools = { workspace = true }
hermix-plugin = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
md5 = { workspace = true }
tiktoken-rs = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json", "multipart"] }
which = "7"
eventsource-stream = { workspace = true }
tokio-stream = { workspace = true }
async-stream = "0.3"
lazy_static = "1"
rusqlite = { workspace = true }
serde_yaml = { workspace = true }
shlex = "1.3.0"
uuid = { workspace = true, features = ["v4"] }
parking_lot = "0.12"
indexmap = { workspace = true }
libloading = { workspace = true }
# Replaces the static-counter PRNG previously used for SQLITE_BUSY retry
# jitter: better statistical quality and per-thread independent streams,
# without pulling in the heavier `rand` dependency for a few random u64s.
fastrand = "2"
fs4 = { workspace = true }
# Approval-card diff: unified before/after for file-mutating tool calls.
similar = "2"

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"
hermix-environments = { workspace = true }
hermix-skills = { workspace = true }
