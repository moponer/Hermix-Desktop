[package]
name = "hermix-cua"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Self-hosted Computer-Use Automation primitives for Hermix Agent (Windows 10/11 x64)"

[dependencies]
hermix-core = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
once_cell = { workspace = true }
base64 = { workspace = true }
# Sync mutex used by `browser::BrowserHandle::page_target_id` —
# the slot is hit on every CDP call, so we want a cheap blocking
# lock here, not a tokio Mutex.
parking_lot = "0.12"

# Self-hosted CDP client (browser automation).
# The CDP stack is the only place in hermix-cua that pulls in
# tokio — everything else is synchronous + blocking, exposed via
# `run_blocking` from the hermix-tools handlers. We deliberately
# keep tokio out of hermix-cua's *public* API; tokio lives only
# behind the `BrowserHandle::connect` / `manager::wait_for_ws`
# boundary.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"

# HTTP client used only by `manager::fetch_ws_endpoint` to probe
# `http://127.0.0.1:9222/json/version` once after Chrome starts.
# Re-exported from workspace with rustls so we don't pull OpenSSL.
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }

# URL parsing (Chrome's `/json/version` returns a bare ws:// URL
# that we hand to tungstenite).
url = { workspace = true }

# Screen capture (BitBlt + GetDesktopWindow). The capture backend
# also supports DXGI Output Duplication (`IDXGIOutputDuplication`)
# for sub-frame latency; the `BitBlt` path is a fallback that always
# works on any Windows 10/11 install with no extra runtime.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # DXGI Output Duplication + D3D11 staging texture.
    # Provides IDXGIFactory1, IDXGIAdapter1, IDXGIOutput1,
    # IDXGIOutputDuplication::AcquireNextFrame, and the D3D11
    # device / device-context / texture surface used to copy the
    # desktop resource into a CPU-readable buffer.
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    # UIAutomation client COM interfaces.
    # Provides IUIAutomation, IUIAutomationElement, IUIAutomationCondition,
    # IUIAutomationTreeWalker, CUIAutomation, control-type IDs, property IDs.
    "Win32_UI_Accessibility",
    # COM runtime for CoCreateInstance / CoInitializeEx / CLSCTX_ALL.
    "Win32_System_Com",
    # OCR via Windows.Media.Ocr WinRT API.
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    # WinRT foundation types (IAsyncOperation etc.).
    "Foundation_Collections",
] }

# PNG encoding via the same `image` crate the rest of the
# workspace already pins. We re-declare it here (rather than
# reaching through hermix-tools) so hermix-cua stays a leaf
# crate without forward dependencies.
[target.'cfg(windows)'.dependencies.image]
version = "0.25"
default-features = false
features = ["png"]

[dev-dependencies]
# `tempfile::tempdir` is used by `trace.rs` tests to verify the
# recorder writes a parseable JSONL file. Not in production
# dependencies — only needed for `cargo test`.
tempfile = "3"

[lints]
workspace = true