[package]
name = "hermix-environments"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Terminal backends and environment management for Hermix Agent"

[features]
default = []
ssh = []
docker = []

[dependencies]
hermix-core = { workspace = true }
hermix-config = { workspace = true }
shlex = "1.3.0"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
encoding_rs = "0.8"
tempfile = "3"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
] }
sha2 = { workspace = true }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
hermix-config = { workspace = true, features = ["test-helpers"] }
