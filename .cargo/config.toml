[build]
# 编译产物位置（2026-08-10 定案，三次迭代后的最终形态）:
# 这里**不再配置 target-dir**. 原因:
#   1. 绝对路径 (如 "<repo>/release/target") 锁死仓库位置,
#      换机器/clone 全炸 —— 绝不允许.
#   2. 相对路径 (如 "release/target") 会被 cargo 按**运行时的 cwd** 解析:
#      纯 cargo 在仓库根跑 → 仓库内, 但 tauri build 的 cargo 子进程相对
#      src-tauri manifest 解析 → 上溯 4 级跑到仓库外 (<repo-parent>\release),
#      产物分裂两处, 用户找不到 —— 同样废弃.
#   3. 唯一正确做法: 不写 target-dir, 产物位置完全交给环境变量
#      CARGO_TARGET_DIR, 由 cargo-env.sh (仓库根, 随仓库走) 用
#      `pwd -W` 按脚本所在目录算出并 export. CARGO_TARGET_DIR 优先级
#      高于本文件任何配置, tauri build 子进程继承 env, 三产物
#      (CLI + 桌面 exe + NSIS bundle) 全落 <仓库根>/release/target/.
#      没 source cargo-env.sh 时 cargo 用默认 <仓库根>/target/ ——
#      依然在仓库内, 不会跑到仓库外. 两个位置 .gitignore 都盖住了.
#
# 铁律: 任何 cargo 命令前必须先 `. ./cargo-env.sh`, 见 README.md "构建" 节.
#
# 为什么不在 Cargo.toml 的 [workspace] 段配 target-dir:
# Cargo 不支持 [workspace].target-dir (会报 `unused manifest key:
# workspace.target-dir`), 唯一合规的入口是环境变量 CARGO_TARGET_DIR.

[target.x86_64-pc-windows-msvc]
# 2026-06-24: 改用 rust-lld.exe 替代 MSVC link.exe. 原因: MSVC link.exe
# 在 hermix workspace 全量 link 时吃 1.5GB+ 内存, 主人机器卡死.
# lld 同样出 MSVC 兼容的 COFF 目标文件 + 找 MSVC LIB/INCLUDE 路径,
# 内存占用降到 ~500MB, 增量重 build 更快.
#
# **触发回退条件** (能不用 lld 的场景):
#   1. VS 调试器 attach 时报 "section merge failed" → 临时换回下方 MSVC 绝对路径
#   2. 发布构建 ([profile.release]) 想用 MSVC 的 /LTCG 链接时代码生成优化
#   3. 链接时遇到 rust-lld 已知 bug (极少见, 通常是带 debug-info 的静态库)
#
# 反 Git Bash link.exe 坑仍然存在: 不要恢复 `link` (无路径), 必须用
# MSVC 绝对路径或 rust-lld.exe (后者在 rustup toolchain PATH 里).
#
# 2026-06-29 临时切到 MSVC link.exe 试验失败 → 切回 rust-lld.exe。
# 失败原因: MSVC link.exe 在 build script 链接阶段 (libsqlite3-sys / moxcms
# / ravif / hermix-config / http) 报 exit code: 1 但 stderr 被 cargo
# 吞掉, 看不到具体缺什么 .lib。rust-lld 是链接 Rust 标准产物经过验证的,
# build script 一般不挑。
linker = "rust-lld.exe"

# 2026-07-05: rust-lld 不读 `LIB` 环境变量, 需要显式传 LIBPATH.
#   Cargo 调用 rustc 时把以下 rustflags 注入到链接命令, 让 lld 知道
#   去哪里找 MSVC SDK 提供的 .lib (kernel32, oldnames, msvcrt, ...).
#   注意: test profile 会加更多 proc-macro dylib, 仍然走同一条链接路径,
#   所以这条配置对 `cargo test` 也生效.
rustflags = [
    "-C", "link-arg=/LIBPATH:C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64",
    "-C", "link-arg=/LIBPATH:C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\um\\x64",
    "-C", "link-arg=/LIBPATH:C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\ucrt\\x64",
]
