[package]
name = "hx-packager"
version = "0.1.0"
edition = "2021"
description = "Hermix 自定义应用打包器 CLI — 把 app_dir 打成单 exe (PE 资源节嵌入) 或起 dev runner"
license = "MIT"

# 独立工程：不污染主 workspace (cargo check 不带 hermix-plugin)
[workspace]

[dependencies]
hermix-plugin = { path = "../../crates/hermix-plugin" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
opt-level = 1