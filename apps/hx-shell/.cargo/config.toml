[build]
# 不配置 target-dir：统一产物位置由 CARGO_TARGET_DIR 环境变量决定
# （npm run build/dev 已设 CARGO_TARGET_DIR=../../release，hx-shell 与
#  hermix-server/tauri 共用 release/target，避免多产物目录分裂）。
# 手动 `cd apps/hx-shell && cargo build` 不设 env 时退回默认 apps/hx-shell/target。

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = [
    "-C", "link-arg=/LIBPATH:C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64",
    "-C", "link-arg=/LIBPATH:C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\um\\x64",
    "-C", "link-arg=/LIBPATH:C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\ucrt\\x64",
]
