[package]
name = "hx-shell"
version = "0.2.0"
edition = "2021"
description = "Hermix 自定义应用壳 — Wry/WebView2 单文件模板壳"
license = "MIT"

# 独立工程：不属于 hermix workspace（避免污染主 workspace 编译）
[workspace]

[profile.release]
strip = true
opt-level = 1

[dependencies]
wry = { version = "0.55.1", features = ["protocol"] }
tao = "0.35.3"
serde_json = "1"
http = "1"
flate2 = "1"
resvg = "0.43"
rfd = "0.14"

[build-dependencies]
# 可选：未来放版本探针
