<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文章 —— Hermix</title>
<meta name="description" content="从实现笔记改写的机制说明：压缩为什么不删东西、审批为什么变少了、索引为什么不退化成全盘遍历。" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="assets/site.css" />
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>

<nav class="nav" data-nav></nav>

<div class="hero">
  <div class="wrap">
    <h1>文章</h1>
    <p class="sub">每篇从实现笔记改写，讲一个机制怎么运转、当时为什么这么选、放弃了什么。不写宣传语，也不复述 README 的概括句。</p>
    <div class="acts"><span class="m" id="count"></span></div>
  </div>
</div>

<main id="main">
<div class="sec">
  <div class="wrap">
    <div class="filters" id="filters" role="group" aria-label="按客户端筛选">
      <button class="on" data-c="all" aria-pressed="true">全部</button>
      <button data-c="desktop" aria-pressed="false">Hermix Desktop</button>
      <button data-c="mobile" aria-pressed="false">Hermix 手机端</button>
      <button data-c="spiker" aria-pressed="false">Spiker</button>
    </div>
    <div class="arts" id="list"></div>
  </div>
</div>
</main>

<footer class="ft" data-footer></footer>

<script src="assets/site.js?v=3"></script>
<script src="assets/articles.js"></script>
<script>
  HERMIX.boot('articles');
  (function () {
    var all = window.ARTICLES || [];
    var names = { desktop: 'Hermix Desktop', mobile: 'Hermix 手机端', spiker: 'Spiker' };
    var list = document.getElementById('list');
    var count = document.getElementById('count');

    // 索引没读到时不渲染成「零篇文章」——那是加载失败，不是真的没有内容。
    if (!all.length) {
      list.innerHTML = '<div class="empty err">文章索引没加载出来。<a href="articles.html">刷新重试</a>，或先去<a href="index.html">首页</a>。</div>';
      return;
    }

    count.textContent = '共 ' + all.length + ' 篇';

    function render(c) {
      var items = c === 'all' ? all : all.filter(function (a) { return a.client === c; });
      list.innerHTML = items.map(function (a) {
        return '<a class="a" href="article.html?id=' + a.id + '">' +
          '<div><div class="t">' + a.title + '<span class="tag">' + names[a.client] + '</span>' +
          '<span class="tag">' + a.cat + '</span></div>' +
          '<div class="d">' + a.sub + '</div></div>' +
          '<div class="r">约 ' + a.words + ' 字<br>' + a.cat + '</div></a>';
      }).join('') || '<div class="empty">这个分类下还没有文章。<a href="articles.html">看全部 ' + all.length + ' 篇</a>。</div>';
    }

    document.getElementById('filters').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      document.querySelectorAll('#filters button').forEach(function (x) {
        var on = x === b;
        x.classList.toggle('on', on);
        x.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      render(b.dataset.c);
    });

    render('all');
  })();
</script>
</body>
</html>
