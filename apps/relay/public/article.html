<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文章 —— Hermix</title>
<link rel="stylesheet" href="assets/site.css" />
</head>
<body>

<nav class="nav" data-nav></nav>

<div class="reader">
  <aside class="rail" id="rail"></aside>
  <article class="body doc" id="doc"><div class="empty">文章加载中……</div></article>
  <div class="spacer" aria-hidden="true"></div>
</div>

<footer class="ft" data-footer></footer>

<script src="assets/site.js"></script>
<script src="assets/articles.js"></script>
<script>
  HERMIX.boot('articles');
  (function () {
    var all = window.ARTICLES || [];
    var names = { desktop: 'Hermix Desktop', mobile: 'Hermix 手机端', spiker: 'Spiker' };
    var links = { desktop: 'desktop.html', mobile: 'mobile.html', spiker: 'spiker.html' };
    var order = ['desktop', 'mobile', 'spiker'];
    var id = new URLSearchParams(location.search).get('id');
    var i = all.findIndex(function (a) { return a.id === id; });
    var doc = document.getElementById('doc');
    var rail = document.getElementById('rail');

    // 左栏：按客户端分组的全部文章，当前篇高亮。
    rail.innerHTML = order.map(function (c) {
      var items = all.filter(function (a) { return a.client === c; });
      if (!items.length) return '';
      return '<div class="k">' + names[c] + '</div>' + items.map(function (a) {
        return '<a href="article.html?id=' + a.id + '" data-id="' + a.id + '"' +
          (a.id === id ? ' class="on"' : '') + '>' + a.title + '</a>';
      }).join('');
    }).join('') + '<div class="all"><a href="articles.html">全部 ' + all.length + ' 篇 →</a></div>';

    if (i < 0) {
      doc.innerHTML =
        '<div class="crumb"><a href="articles.html">文章</a></div>' +
        '<h1>没找到这篇</h1>' +
        '<p>链接里的文章不存在或已改名。<a href="articles.html">回文章列表</a>。</p>';
      return;
    }

    var a = all[i];
    document.title = a.title + ' —— Hermix';

    var cur = rail.querySelector('[data-id="' + a.id + '"]');
    if (cur) cur.scrollIntoView({ block: 'nearest' });

    var prev = i > 0 ? all[i - 1] : null;
    var next = i < all.length - 1 ? all[i + 1] : null;
    var nav = '<p style="margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:13.5px">' +
      (prev ? '← <a href="article.html?id=' + prev.id + '">' + prev.title + '</a><br>' : '') +
      (next ? '<a href="article.html?id=' + next.id + '">' + next.title + '</a> →' : '') + '</p>';

    doc.innerHTML =
      '<div class="crumb"><a href="articles.html">文章</a> · ' +
      '<a href="' + links[a.client] + '">' + names[a.client] + '</a></div>' +
      '<h1>' + a.title + '</h1>' +
      '<p class="meta">约 ' + a.words + ' 字 · ' + a.cat + '</p>' +
      a.body.join('') +
      '<div class="src">改写自实现笔记：' + a.source + '</div>' +
      nav;
  })();
</script>
</body>
</html>
