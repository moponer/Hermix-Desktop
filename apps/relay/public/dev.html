<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>开发者文档 —— Hermix</title>
<meta name="description" content="仓库结构、构建、内核四件套、接缝与插件、工具开发、HTTP 接口、数据模型、测试门禁、发版流程。" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="assets/site.css?v=2" />
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>

<nav class="nav" data-nav></nav>

<div class="docs">
  <aside class="side" id="side" aria-label="文档目录"></aside>
  <main class="main" id="main"></main>
</div>

<footer class="ft" data-footer></footer>

<script src="assets/site.js?v=4"></script>
<script src="assets/docs.js"></script>
<script>
  HERMIX.boot('docs');
  (function () {
    var docs = (window.DOCS || {}).dev || [];
    var side = document.getElementById('side');
    var main = document.getElementById('main');

    if (!docs.length) {
      main.innerHTML = '<div class="empty err">文档索引没加载出来。<a href="dev.html">刷新重试</a>，或先去<a href="index.html">首页</a>。</div>';
      return;
    }

    side.innerHTML =
      '<div class="k">开发者文档</div>' +
      docs.map(function (d) {
        return '<a href="#' + d.id + '" data-id="' + d.id + '">' + d.title + '</a>';
      }).join('') +
      '<div class="k">其它</div>' +
      '<a href="docs.html">使用文档</a>' +
      '<a href="articles.html">文章</a>';

    main.innerHTML = docs.map(function (d) {
      return '<section id="' + d.id + '"><h2>' + d.title + '</h2>' + d.body.join('') + '</section>';
    }).join('');

    var links = Array.prototype.slice.call(side.querySelectorAll('[data-id]'));
    function mark() {
      var id = location.hash.replace('#', '');
      links.forEach(function (a) { a.classList.toggle('on', a.dataset.id === id); });
    }
    window.addEventListener('hashchange', mark);

    // 锚点来自地址栏，可能是任意字符串：非法选择器会抛错，整页脚本就停在这里。
    if (location.hash) {
      var t = null;
      try { t = document.querySelector(location.hash); } catch (err) { t = null; }
      if (t) setTimeout(function () { t.scrollIntoView(); }, 60);
    } else if (links.length) {
      links[0].classList.add('on');
    }
    mark();
  })();
</script>
</body>
</html>
