[package]
name = "hermix-viewer"
version = "0.1.0"
edition = "2021"
description = "Hermix 独立文件浏览器：多标签 + AI 右栏（决策笔记 proposed/feature/2026-10-09-standalone-file-viewer.md）"
license = "MIT"
default-run = "hermix-viewer"

[build-dependencies]
tauri-build = { version = "2" }
# feature 垫片：schemars 0.8（tauri-build 的 build-dependency）开 preserve_order
# 后拉起 indexmap 1.9.3，其 build.rs 靠 autocfg 运行时探测 emit `has_std`，本机
# 探测静默失败 → 走 no_std 分支（IndexMap<K, V, S> 三泛型无默认）→ schemars
# 两参调用直接 E0107。resolver v2 下 build-dep 图与普通依赖图 feature 不互通，
# 所以垫片必须放在这里（build-dependencies）才统一进 schemars 的编译单元。
# 显式 std 后 build.rs 走 CARGO_FEATURE_STD 快速路径无条件 emit，跳过探测。
# 代码不引用，仅为传递依赖统一 feature。与 desktop-tauri 同一坑，见其注释。
indexmap1 = { package = "indexmap", version = "1.9", features = ["std"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 图片处理内核（F5 重量模式）。与 desktop-tauri 的 image 声明并存：
# feature 集不同（viewer 还要 ico / tiff / webp / gif / bmp 供编辑与转换），
# Cargo 取 feature 并集。刻意 default-features = false 且**不开 avif**——
# avif 走 ravif → rav1e，rav1e 的 asm feature 需要 nasm（本机 MSVC 没有）。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff"] }
# 「另存为」系统对话框：只调 Rust 侧 API，前端不装 npm 包
#（@tauri-apps/plugin-dialog），前端依赖增量保持 0。
tauri-plugin-dialog = "2"
# AI 右栏：直连本地 server 的 /v1/ REST（viewer 是独立进程，不走主程序
# 的 stdio 桥——那根管道归主 app 的前端所有）。
reqwest = { workspace = true, features = ["json"] }
# 单实例互斥体（CreateMutexW：Foundation + Security 双 feature 门控）；
# GetLastError 在 Foundation（同 updater.rs 教训：跨模块声明依赖它）。
[target.'cfg(windows)'.dependencies]
# Win32_System_WindowsProgramming：DRIVE_FIXED / DRIVE_REMOTE / DRIVE_CDROM
# 等盘符类型常量在 windows-sys 0.52 里位于该模块（不在 FileSystem 下），
# 用来在不碰文件系统的前提下判定盘符类型（见 commands.rs::viewer_drives）。
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[[bin]]
name = "hermix-viewer"
path = "src/main.rs"
