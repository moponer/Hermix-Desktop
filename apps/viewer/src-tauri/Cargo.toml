[package]
name = "hermix-viewer"
version = "0.1.0"
edition = "2021"
description = "Hermix 独立文件浏览器：多标签 + AI 右栏（决策笔记 proposed/feature/2026-10-09-standalone-file-viewer.md）"
license = "MIT"
default-run = "hermix-viewer"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AI 右栏：直连本地 server 的 /v1/ REST（viewer 是独立进程，不走主程序
# 的 stdio 桥——那根管道归主 app 的前端所有）。
reqwest = { workspace = true, features = ["json"] }
# 单实例互斥体（CreateMutexW：Foundation + Security 双 feature 门控）；
# GetLastError 在 Foundation（同 updater.rs 教训：跨模块声明依赖它）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[[bin]]
name = "hermix-viewer"
path = "src/main.rs"
