# 2026-08-10: **不再配置 target-dir**. 历史配置 (2026-06-20) 曾用
# target-dir = "../../../../release/target" —— 从 src-tauri 出发上溯
# 4 级 = <repo-root 的父级>/release/target, 即仓库外的 <repo-parent>\release\target,
# 导致 tauri build 产物分裂到仓库外、用户找不到. 相对路径会按 cargo
# 当前 cwd 解析, 同一份 config 在不同目录跑结果不同, 是坑.
#
# 产物位置唯一控制点 = 环境变量 CARGO_TARGET_DIR, 由仓库根 cargo-env.sh
# 用 `pwd -W` 按脚本所在目录算出并 export. 优先级: CARGO_TARGET_DIR >
# 任何 .cargo/config.toml. tauri build 子进程继承 env, 产物落
# <仓库根>/release/target/ (CLI + 桌面 exe + NSIS bundle 三合一).
# 没 source cargo-env.sh 时, 本 sub-workspace 用 cargo 默认
# src-tauri/target (仓库内, .gitignore 已覆盖).
#
# 注意: 本文件保留 (而非删除) 是为了防止 cargo 在 src-tauri 目录跑时
# 找不到 [build] 段配置而报错, 同时作为"此处有意不配 target-dir"的
# 文档锚点. 若 cargo 后续版本对空 [build] 段有意见, 直接删掉整个文件
# 即可, 产物位置不受影响.
[build]
