[package]
name = "hermix-desktop"
version = "0.1.9"
edition = "2021"
# 本包有两个 bin：主程序 + 主进程拉起的提权索引辅助进程
# （usn-indexer，见下方 [[bin]]）。不指定 default-run 时 `cargo run`
# 会报"could not determine which binary to run"。
default-run = "hermix-desktop"

[dependencies]
# `tray-icon`：托盘（显示在菜单栏）用 Tauri 内置 feature，不引第三方插件。
tauri = { version = "2", features = [ "protocol-asset", "tray-icon" ] }
# N0 探针（cdp_probe.rs）：进程内 CDP。**必须与 tauri 的传递依赖同 minor**——
# tauri 2.12.1 拉的是 webview2-com 0.39（配 windows-core 0.62）；写死 0.38 会
# 出现「同名 crate 两个版本」，ICoreWebView2 类型互不兼容，编译期 E0308。
# tauri 升 minor 后用这条自查：`cargo tree -i webview2-com`（应只有一条路径）。
webview2-com = "0.39"
windows-core = "0.62"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# 设置页「通用」的两项系统级能力（2026-10-02）：
# · notification → 桌面通知
# · autostart   → 开机自启动（Windows 走注册表 Run 键）
# 两者都是官方插件，能力此前缺失是因为没人加依赖，不是后端不支持。
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "6"
open = "5"
base64 = "0.22"
once_cell = "1"
# `which` is used by `commands::python_detect` for the Settings → Backend
# tab "Python 运行时" probe (PATH:python, PATH:python3 etc.). NOT
# consumed by hermix-tools directly because that crate has its own dep.
which = "6"

# Self-hosted Computer-Use Automation primitives (Phase 1).
# Only `capture`/`action` modules are Windows-gated inside
# `hermix-cua` itself, so this dep compiles cleanly on macOS / Linux
# CI hosts — every Windows-only entry point there is `#[cfg(windows)]`
# with a `NotFound` stub for the other side. The Tauri commands in
# `commands_cua.rs` mirror the same pattern.
hermix-cua = { path = "../../../crates/hermix-cua" }
hermix-plugin = { path = "../../../crates/hermix-plugin" }
hermix-config = { path = "../../../crates/hermix-config" }

# 本地快速查找（侧栏「本地查找」）：jwalk 并行目录遍历建索引 +
# nucleo-matcher（Helix 编辑器同款模糊匹配算法）。NTFS MFT 原始读取
# 需要管理员权限，桌面应用不适合，因此用并行遍历方案（毫秒级即可
# 索引常用目录；全盘首次索引在后台线程完成，不阻塞 UI）。
jwalk = "0.9"
nucleo-matcher = "0.3"
tauri-plugin-global-shortcut = "2"
image = { version = "0.25", features = ["png"] }

# 索引遍历线程降为 BELOW_NORMAL 优先级：全盘扫描不抢 UI 线程。
# windows crate 已在依赖树中（hermix-cua 同版本 0.58），仅补 Threading feature。
[target.'cfg(windows)'.dependencies]
# xcap：截图抓屏（GDI 一次性抓帧，方案见 docs/notes/implemented/feature/2026-10-07-screenshot-tool.md）
xcap = "0.9"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # 截图：剪贴板直写（DataExchange/Ole）+ 窗口识别排除 cloak（Dwm）
  # + ESC 键盘监听（KeyboardAndMouse，覆盖窗失去焦点时也能退出）
  "Win32_System_DataExchange",
  "Win32_System_Ole",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[target.windows.dependencies]

# 提权索引辅助进程（读 MFT 需要管理员权限，主程序不提权）。
# 作为同 crate 的第二个 bin：构建产物与主程序同目录，
# 主进程按 current_exe().parent()/usn-indexer.exe 定位拉起。
[[bin]]
name = "usn-indexer"
path = "src/bin/usn_indexer.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# feature 垫片：schemars 0.8（tauri-build 的 build-dependency）开 preserve_order
# 后拉起 indexmap 1.9.3，其 build.rs 靠 autocfg 运行时探测 emit `has_std`，本机
# 探测静默失败 → 走 no_std 分支（IndexMap<K, V, S> 三泛型无默认）→ schemars
# 两参调用直接 E0107。resolver v2 下 build-dep 图与普通依赖图 feature 不互通，
# 所以垫片必须放在这里（build-dependencies）才统一进 schemars 的编译单元。
# 显式 std 后 build.rs 走 CARGO_FEATURE_STD 快速路径无条件 emit，跳过探测。
# 代码不引用，仅为传递依赖统一 feature。
indexmap1 = { package = "indexmap", version = "1.9", features = ["std"] }

[dev-dependencies]
# `browser_cleanup::tests` uses `tempfile::tempdir()` to pin
# HERMIX_PORTABLE_DATA_DIR at a sandboxed path so we never touch
# the developer's real data dir.
tempfile = "3"

[lib]
name = "hermix_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]
