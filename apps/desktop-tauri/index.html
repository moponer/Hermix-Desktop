<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon-180.png" />
    <meta name="color-scheme" content="light dark" />
    <title>Hermix Desktop</title>
    <script>
      // Theme bootstrap (runs before React to avoid FOUC)
      (function() {
        try {
          var t = localStorage.getItem("hermes.desktop.theme");
          if (t === "dark" || (t !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // 启动遮罩终极保险 —— 独立于 main.tsx 的模块图运行（经典脚本，不依赖任何 import）。
      // 若 main.tsx 因某个依赖在求值期抛错而整体崩掉，第 122 行那个 22s 兜底根本不会注册，
      // 这里的内联兜底仍能无条件关掉 splash，避免界面永久卡在启动页。
      (function () {
        var SP_FALLBACK_MS = 10000;
        function hideSplash() {
          var s = document.getElementById("splash");
          if (s && !s.classList.contains("hide")) {
            s.classList.add("hide");
            setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400);
          }
        }
        window.__hermixHideSplash = hideSplash;
        setTimeout(hideSplash, SP_FALLBACK_MS);
        // 把模块求值/运行期错误打到 console，便于无头探测抓取真实根因（安装版无 devtools 时也留痕）。
        window.addEventListener("error", function (e) {
          try { console.error("[hermix-boot] error:", e.message, (e.filename || "") + ":" + (e.lineno || 0)); } catch (_) {}
        });
        window.addEventListener("unhandledrejection", function (e) {
          try { console.error("[hermix-boot] unhandledrejection:", e.reason && (e.reason.stack || e.reason.message || e.reason)); } catch (_) {}
        });
      })();
    </script>
    <style>
      /* ── Splash tokens — clean, minimal ── */
      :root {
        --sp-bg: #ffffff;
        --sp-ink: #1c1c1e;
        --sp-ink-soft: #8e8e93;
        --sp-accent: #22c55e;
        --sp-track: #e5e5ea;
      }
      html.dark {
        --sp-bg: #0f0f12;
        --sp-ink: #f5f5f7;
        --sp-ink-soft: #636366;
        --sp-accent: #22c55e;
        --sp-track: #2c2c2e;
      }

      html, body, #root { height: 100%; margin: 0; }
      body {
        background: var(--sp-bg);
        color: var(--sp-ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Splash root ── */
      #splash {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: var(--sp-bg);
        z-index: 9999;
        transition: opacity 0.4s ease, transform 0.4s ease;
        overflow: hidden;
      }
      #splash.hide {
        opacity: 0;
        transform: scale(1.01);
        pointer-events: none;
      }

      /* ── Titlebar (drag region only) ── */
      .sp-titlebar {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 40px;
        -webkit-app-region: drag;
        z-index: 10;
      }

      /* ── Window controls: 无边框窗口, 启动卡住时给用户退路 ── */
      .sp-win-controls {
        position: absolute;
        top: 0; right: 0;
        height: 40px;
        display: flex;
        z-index: 20;
        -webkit-app-region: no-drag;
      }
      .sp-win-btn {
        width: 46px; height: 40px;
        border: 0; padding: 0;
        background: transparent;
        color: var(--sp-ink-soft);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .sp-win-btn:hover { background: rgba(128, 128, 128, 0.16); }
      .sp-win-btn.sp-close:hover { background: #c42b1c; color: #fff; }

      /* ── Stage ── */
      .sp-stage {
        position: relative;
        display: flex; flex-direction: column;
        align-items: center;
        text-align: center;
        z-index: 1;
      }

      /* ── Mascot ── */
      .sp-logo {
        width: 128px; height: 128px;
        opacity: 0;
        transform: translateY(12px) scale(0.95);
        animation: sp-fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
      }

      /* ── Title ── */
      .sp-title {
        margin-top: 28px;
        font-size: 26px;
        font-weight: 700;
        color: var(--sp-ink);
        letter-spacing: 0.02em;
        opacity: 0;
        transform: translateY(8px);
        animation: sp-fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      }

      /* ── Description ── */
      .sp-desc {
        margin-top: 10px;
        font-size: 14px;
        line-height: 1.5;
        color: var(--sp-ink-soft);
        max-width: 320px;
        opacity: 0;
        transform: translateY(8px);
        animation: sp-fade-up 0.6s ease 0.3s forwards;
      }

      /* ── Progress bar ── */
      .sp-progress-wrap {
        margin-top: 32px;
        width: 320px;
        opacity: 0;
        animation: sp-fade-up 0.6s ease 0.4s forwards;
      }
      .sp-progress {
        width: 100%;
        height: 6px;
        background: var(--sp-track);
        border-radius: 999px;
        overflow: hidden;
      }
      .sp-progress-bar {
        height: 100%;
        width: 0%;
        background: var(--sp-accent);
        border-radius: 999px;
        transition: width 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      /* Smooth auto-advance animation: 0 → 80% over ~4s */
      @keyframes sp-progress-auto {
        0%   { width: 0%; }
        15%  { width: 18%; }
        35%  { width: 40%; }
        60%  { width: 62%; }
        82%  { width: 78%; }
        100% { width: 83%; }
      }
      .sp-progress-bar.animating {
        animation: sp-progress-auto 4.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s forwards;
      }

      /* ── Subtitle ── */
      .sp-sub {
        margin-top: 14px;
        font-size: 13px;
        color: var(--sp-ink-soft);
        opacity: 0;
        animation: sp-fade-up 0.6s ease 0.5s forwards;
      }

      /* ── Keyframes ── */
      @keyframes sp-fade-up {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          transition-duration: 0.15s !important;
        }
        .sp-logo, .sp-title, .sp-desc,
        .sp-progress-wrap, .sp-sub { opacity: 1 !important; transform: none !important; }
        .sp-progress-bar { width: 60% !important; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash" role="status" aria-label="Hermix Desktop 正在启动">
        <!-- Drag region for titlebar -->
        <div class="sp-titlebar" aria-hidden="true"></div>

        <!-- 无边框窗口没有系统标题栏, 启动异常时靠这两个按钮退出 -->
        <div class="sp-win-controls">
          <button class="sp-win-btn" id="sp-minimize" type="button" title="最小化" aria-label="最小化">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <path d="M2 6h8" />
            </svg>
          </button>
          <button class="sp-win-btn sp-close" id="sp-close" type="button" title="关闭" aria-label="关闭">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <path d="M2.5 2.5l7 7M9.5 2.5l-7 7" />
            </svg>
          </button>
        </div>

        <div class="sp-stage">
          <!-- Mascot -->
          <img class="sp-logo" src="./mascot-256.png"
               alt="" width="128" height="128" draggable="false" />

          <div class="sp-title">环境准备中</div>
          <div class="sp-desc">正在准备运行环境，请稍候，完成后自动进入主界面。</div>

          <!-- Progress bar -->
          <div class="sp-progress-wrap">
            <div class="sp-progress">
              <div class="sp-progress-bar animating" id="sp-progress-bar"></div>
            </div>
          </div>

          <!-- 阶段文案由 main.tsx 按 Tauri 端 hermix:boot-stage 事件实时更新 -->
          <div class="sp-sub" id="sp-stage-text">正在初始化…</div>
        </div>
      </div>
    </div>

    <!-- 启动状态由 /src/main.tsx 驱动: 走 stdio bridge 探活, 并按
         hermix:boot-stage 事件刷新阶段文案。此处不再内联 HTTP 轮询
         —— stdio 模式没有 HTTP 服务, 内联 fetch 必然全部失败。 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
