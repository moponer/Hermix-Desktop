<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon-180.png" />
    <meta name="color-scheme" content="light dark" />
    <title>Hermix Desktop</title>
    <script>
      // Theme bootstrap (runs before React to avoid FOUC)
      (function() {
        try {
          var t = localStorage.getItem("hermes.desktop.theme");
          if (t === "dark" || (t !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* ── Splash tokens — clean, minimal ── */
      :root {
        --sp-bg: #ffffff;
        --sp-ink: #1c1c1e;
        --sp-ink-soft: #8e8e93;
        --sp-accent: #22c55e;
        --sp-track: #e5e5ea;
      }
      html.dark {
        --sp-bg: #0f0f12;
        --sp-ink: #f5f5f7;
        --sp-ink-soft: #636366;
        --sp-accent: #22c55e;
        --sp-track: #2c2c2e;
      }

      html, body, #root { height: 100%; margin: 0; }
      body {
        background: var(--sp-bg);
        color: var(--sp-ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Splash root ── */
      #splash {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: var(--sp-bg);
        z-index: 9999;
        transition: opacity 0.4s ease, transform 0.4s ease;
        overflow: hidden;
      }
      #splash.hide {
        opacity: 0;
        transform: scale(1.01);
        pointer-events: none;
      }

      /* ── Titlebar (drag region only) ── */
      .sp-titlebar {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 40px;
        -webkit-app-region: drag;
        z-index: 10;
      }

      /* ── Stage ── */
      .sp-stage {
        position: relative;
        display: flex; flex-direction: column;
        align-items: center;
        text-align: center;
        z-index: 1;
      }

      /* ── Mascot ── */
      .sp-logo {
        width: 128px; height: 128px;
        opacity: 0;
        transform: translateY(12px) scale(0.95);
        animation: sp-fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
      }

      /* ── Title ── */
      .sp-title {
        margin-top: 28px;
        font-size: 26px;
        font-weight: 700;
        color: var(--sp-ink);
        letter-spacing: 0.02em;
        opacity: 0;
        transform: translateY(8px);
        animation: sp-fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      }

      /* ── Description ── */
      .sp-desc {
        margin-top: 10px;
        font-size: 14px;
        line-height: 1.5;
        color: var(--sp-ink-soft);
        max-width: 320px;
        opacity: 0;
        transform: translateY(8px);
        animation: sp-fade-up 0.6s ease 0.3s forwards;
      }

      /* ── Progress bar ── */
      .sp-progress-wrap {
        margin-top: 32px;
        width: 320px;
        opacity: 0;
        animation: sp-fade-up 0.6s ease 0.4s forwards;
      }
      .sp-progress {
        width: 100%;
        height: 6px;
        background: var(--sp-track);
        border-radius: 999px;
        overflow: hidden;
      }
      .sp-progress-bar {
        height: 100%;
        width: 0%;
        background: var(--sp-accent);
        border-radius: 999px;
        transition: width 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      /* Smooth auto-advance animation: 0 → 80% over ~4s */
      @keyframes sp-progress-auto {
        0%   { width: 0%; }
        15%  { width: 18%; }
        35%  { width: 40%; }
        60%  { width: 62%; }
        82%  { width: 78%; }
        100% { width: 83%; }
      }
      .sp-progress-bar.animating {
        animation: sp-progress-auto 4.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s forwards;
      }

      /* ── Subtitle ── */
      .sp-sub {
        margin-top: 14px;
        font-size: 13px;
        color: var(--sp-ink-soft);
        opacity: 0;
        animation: sp-fade-up 0.6s ease 0.5s forwards;
      }

      /* ── Keyframes ── */
      @keyframes sp-fade-up {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          transition-duration: 0.15s !important;
        }
        .sp-logo, .sp-title, .sp-desc,
        .sp-progress-wrap, .sp-sub { opacity: 1 !important; transform: none !important; }
        .sp-progress-bar { width: 60% !important; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash" role="status" aria-label="Hermix Desktop 正在启动">
        <!-- Drag region for titlebar -->
        <div class="sp-titlebar" aria-hidden="true"></div>

        <div class="sp-stage">
          <!-- Mascot -->
          <img class="sp-logo" src="./mascot-256.png"
               alt="" width="128" height="128" draggable="false" />

          <div class="sp-title">环境准备中</div>
          <div class="sp-desc">正在准备运行环境，请稍候，完成后自动进入主界面。</div>

          <!-- Progress bar -->
          <div class="sp-progress-wrap">
            <div class="sp-progress">
              <div class="sp-progress-bar animating" id="sp-progress-bar"></div>
            </div>
          </div>

          <div class="sp-sub">Preparing runtime...</div>
        </div>
      </div>
    </div>

    <!-- Real startup status: polls /health, fills progress bar. -->
    <script>
      (function() {
        var bar = document.getElementById("sp-progress-bar");
        if (!bar) return;

        // Poll /health — on success, fill bar to 100%
        var pollTimer = setInterval(function() {
          fetch("http://127.0.0.1:3000/health", { mode: "no-cors" })
            .then(function() {
              clearInterval(pollTimer);
              // Stop CSS animation and snap to 100%
              bar.classList.remove("animating");
              bar.style.width = "100%";
            })
            .catch(function() {});
        }, 500);

        // Clean up if splash is removed
        var observer = new MutationObserver(function() {
          if (!document.getElementById("splash")) {
            clearInterval(pollTimer);
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
