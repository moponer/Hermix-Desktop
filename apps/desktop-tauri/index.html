<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon-180.png" />
    <meta name="color-scheme" content="light dark" />
    <title>Hermix Desktop</title>
    <script>
      // Theme bootstrap — 早于 React / Vite 加载运行，避免 FOUC。
      // 与 useTheme.ts 共用 STORAGE_KEYS.theme = "hermix.desktop.theme"。
      // 主程序挂载后 useTheme 会再 readStored() 一次（已存 key 同名），不会覆写。
      // 暗色兜底：没设置主题且系统偏好暗色 → 默认 dark。
      (function() {
        var root = document.documentElement;
        // 截图覆盖窗：底色压黑。主启动遮罩/亮色主题都是白底，覆盖窗复用
        // 本页面时白底会在 JS 就绪前整屏闪白。
        if (location.hash.indexOf("#/screenshot-overlay") === 0) {
          root.setAttribute("data-overlay", "1");
        }
        function apply(id) {
          root.setAttribute("data-theme", id);
          try { root.style.colorScheme = id === "light" ? "light" : "dark"; } catch (_) {}
        }
        var stored = null;
        try { stored = localStorage.getItem("hermix.desktop.theme"); } catch (_) {}
        if (stored === "light" || stored === "dark" || stored === "rainforest" || stored === "sunset") {
          apply(stored);
        } else {
          var darkPref = false;
          try { darkPref = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (_) {}
          apply(darkPref ? "dark" : "light");
        }
      })();
    </script>
    <script>
      // 启动遮罩终极保险 —— 独立于 main.tsx 的模块图运行（经典脚本，不依赖任何 import）。
      // 若 main.tsx 因某个依赖在求值期抛错而整体崩掉，第 122 行那个 22s 兜底根本不会注册，
      // 这里的内联兜底仍能无条件关掉 splash，避免界面永久卡在启动页。
      (function () {
        var SP_FALLBACK_MS = 10000;
        function hideSplash() {
          var s = document.getElementById("splash");
          if (s && !s.classList.contains("hide")) {
            s.classList.add("hide");
            setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400);
          }
        }
        window.__hermixHideSplash = hideSplash;
        setTimeout(hideSplash, SP_FALLBACK_MS);
        // 把模块求值/运行期错误打到 console，便于无头探测抓取真实根因（安装版无 devtools 时也留痕）。
        window.addEventListener("error", function (e) {
          try { console.error("[hermix-boot] error:", e.message, (e.filename || "") + ":" + (e.lineno || 0)); } catch (_) {}
        });
        window.addEventListener("unhandledrejection", function (e) {
          try { console.error("[hermix-boot] unhandledrejection:", e.reason && (e.reason.stack || e.reason.message || e.reason)); } catch (_) {}
        });
      })();
    </script>
    <style>
      /* ── Splash tokens：与主程序主题 token 同名映射（4 主题） ──
         React 挂载前 themes/*.css 未加载，这里按 data-theme 直接给值；
         主程序挂载后同 token 名自然让位。 */
      :root {
        --sp-bg: var(--color-bg-app, #0b0b0b);
        --sp-ink: var(--color-text-primary, #f4f4f4);
        --sp-ink-soft: var(--color-text-tertiary, #adadad);
        --sp-accent: var(--color-accent, #6fae94);
        --sp-track: var(--color-border-subtle, #2b271f);
      }
      html[data-theme="light"]:root, :root:not([data-theme]) {
        --sp-bg: #ffffff; --sp-ink: #242424; --sp-ink-soft: #6e6e6e;
        --sp-accent: #1e4a3c; --sp-track: #ececea;
      }
      html[data-theme="dark"]:root {
        --sp-bg: #0b0b0b; --sp-ink: #f4f4f4; --sp-ink-soft: #9d9d97;
        --sp-accent: #6fae94; --sp-track: #26221c;
      }
      html[data-theme="rainforest"]:root {
        --sp-bg: #0c1210; --sp-ink: #e8f1e9; --sp-ink-soft: #85a08b;
        --sp-accent: #2dd4bf; --sp-track: #1c2822;
      }
      html[data-theme="sunset"]:root {
        --sp-bg: #1d1915; --sp-ink: #e8e0d2; --sp-ink-soft: #7d7260;
        --sp-accent: #e0701c; --sp-track: #332c23;
      }

      html, body, #root { height: 100%; margin: 0; }
      /* 截图覆盖窗：整页压黑，见上方 bootstrap 脚本 */
      html[data-overlay], html[data-overlay] body { background: #000 !important; }
      /* 覆盖窗静态隐藏启动遮罩——#splash 是静态 HTML，覆盖窗加载时就先渲染
         （启动屏样式、亮色白底），JS 层移除要等 bundle 加载完。CSS 静态
         隐藏从源头堵住"兜底 show 时窗口亮成全屏启动屏"的整类问题。 */
      html[data-overlay] #splash { display: none !important; }
      /* 覆盖窗首帧占位（React 挂载前）：黑底 + 提示文字，与 .so-loading 同文无缝交接 */
      #overlay-boot {
        display: none;
        position: fixed; inset: 0;
        align-items: center; justify-content: center;
        background: #000; color: rgba(255, 255, 255, 0.75);
        font-size: 14px; z-index: 9998;
      }
      html[data-overlay] #overlay-boot { display: flex; }
      body {
        background: var(--sp-bg);
        color: var(--sp-ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Splash root（2026-10-23 重设计）─────────────────────────
         旧版是「112px 吉祥物 + 顶光径向渐变 + 6px 流光进度条 + 环形阶段点」，
         四套装饰叠在一起 —— 启动屏停留 3-8 秒，装饰越多越显得廉价。

         新版只保留三层信息：**标记 / 进度 / 当前在做什么**。
         背景改为纯平纸面（去掉径向渐变：它是唯一一处「发光」装饰，且
         在四套主题下都压不住底纹），层次全靠字号与墨色。

         退场从 scale(0.995) 改成整体上移 8px + 淡出：缩放会让文字在最后
         一帧轻微抖动，上移是「交班」的语义（启动屏让位给主界面）。 */
      #splash {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: var(--sp-bg);
        z-index: 9999;
        transition: opacity 0.32s ease, transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
      }
      #splash.hide {
        opacity: 0;
        transform: translateY(-8px);
        pointer-events: none;
      }

      /* ── Titlebar drag region ── */
      .sp-titlebar {
        position: absolute; top: 0; left: 0; right: 0; height: 40px;
        -webkit-app-region: drag; z-index: 10;
      }

      /* ── Window controls：无边框窗口，启动异常时给用户退路 ── */
      .sp-win-controls {
        position: absolute; top: 0; right: 0; height: 40px;
        display: flex; z-index: 20; -webkit-app-region: no-drag;
      }
      .sp-win-btn {
        width: 46px; height: 40px; border: 0; padding: 0;
        background: transparent; color: var(--sp-ink-soft);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
      }
      .sp-win-btn:hover { background: color-mix(in srgb, var(--sp-ink) 12%, transparent); }
      .sp-win-btn.sp-close:hover { background: #c42b1c; color: #fff; }

      /* ── Stage 列布局 ── */
      .sp-stage {
        position: relative; z-index: 1;
        display: flex; flex-direction: column; align-items: center;
        text-align: center; width: 320px;
      }

      /* ── 标记：墨点 + 描边环（自绘入场）─────────────────────────
         不用位图：启动屏必须在 CSS 就绪的同一帧就能画出来，图片要等
         一次网络/磁盘往返，慢时先闪一个空格子。
         造型取「墨点落纸」—— 一滴墨（accent 实色）+ 一圈细环（12% 墨），
         与应用的「墨与纸」语言同源。

         动画只有两条，都是一次性的（不是装饰性循环）：
           · 环用 stroke-dashoffset 从 0 画到满（0.9s）
           · 墨点从 0.6 放大到 1（0.7s，慢 0.15s 起，先有环再有墨）
         循环动效一律不做 —— 启动屏停留时长不可控，循环动画停在半途最尴尬。 */
      .sp-mark {
        position: relative;
        width: 88px; height: 88px;
        opacity: 0;
        animation: sp-fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
      }
      .sp-mark svg { width: 100%; height: 100%; display: block; overflow: visible; }
      .sp-mark-ring {
        fill: none;
        stroke: var(--sp-track);
        stroke-width: 2;
        stroke-dasharray: 220;
        stroke-dashoffset: 220;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
        animation: sp-draw 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
      }
      .sp-mark-drop {
        fill: var(--sp-accent);
        transform: scale(0.6);
        transform-origin: 50% 62%;
        animation: sp-drop 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
      }
      .sp-mark-shadow {
        fill: var(--sp-accent);
        opacity: 0.14;
        transform: scale(0.6);
        transform-origin: 50% 62%;
        animation: sp-drop 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
      }

      /* ── 品牌 + 副标 ── */
      .sp-title {
        margin-top: 24px;
        font-size: 25px; font-weight: 600; letter-spacing: -0.01em;
        color: var(--sp-ink);
        opacity: 0; transform: translateY(8px);
        animation: sp-fade-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.34s forwards;
      }
      .sp-title .sp-title-dim { color: var(--sp-ink-soft); font-weight: 500; }
      .sp-desc {
        margin-top: 8px; font-size: 13px; line-height: 1.55;
        color: var(--sp-ink-soft); max-width: 320px;
        opacity: 0; transform: translateY(8px);
        animation: sp-fade-up 0.7s ease 0.44s forwards;
      }

      /* ── 进度：2px 轨道（不是 6px）─────────────────────────────
         6px 的进度条在 320px 宽的启动屏上是一道粗棒，配上流光和高亮阴影
         就成了「进度条组件」而不是「状态指示」。2px 是发丝级：看得见在走，
         又不抢标记的焦点。填充用纯 accent（去掉渐变与外发光）。 */
      .sp-progress-wrap {
        margin-top: 40px; width: 320px;
        opacity: 0;
        animation: sp-fade-up 0.7s ease 0.54s forwards;
      }
      .sp-progress-track {
        position: relative; width: 100%; height: 2px;
        background: var(--sp-track); border-radius: 999px; overflow: hidden;
      }
      .sp-progress-bar {
        height: 100%; width: 0%; border-radius: 999px;
        background: var(--sp-accent);
        transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .sp-progress-meta {
        display: flex; justify-content: space-between; align-items: baseline;
        margin-top: 10px;
      }
      #sp-progress-text {
        font-size: 12px; color: var(--sp-ink-soft); letter-spacing: 0.01em;
      }
      .sp-pct {
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 13px; font-weight: 600; color: var(--sp-ink-soft);
        font-variant-numeric: tabular-nums; line-height: 1;
      }
      .sp-pct .sp-pct-sign { font-size: 11px; font-weight: 500; margin-left: 1px; }

      /* ── 阶段列表：扁平圆点，无描边 ───────────────────────────
         旧版每个圆点都有 1.5px 边框（pending 是空心圈、done 是勾）。
         无描边体系下改成三档**填充浓度**：已完成=accent 实色、进行中=
         accent + 外扩晕、未开始=轨道色。浓度差代替框线。 */
      .sp-stages {
        margin-top: 26px; width: 320px; text-align: left;
        opacity: 0;
        animation: sp-fade-up 0.7s ease 0.64s forwards;
      }
      .sp-stage-item {
        display: flex; align-items: center; gap: 12px;
        padding: 5px 0; font-size: 12.5px; color: var(--sp-ink-soft);
        opacity: 0.5;
        transition: color 0.45s ease, opacity 0.45s ease;
      }
      .sp-stage-item .sp-ico {
        flex: 0 0 8px; width: 8px; height: 8px;
        border: 0; border-radius: 50%;
        background: var(--sp-track);
        position: relative;
        transition: background-color 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .sp-stage-item .sp-label { flex: 1; text-align: left; }
      .sp-stage-item.done { opacity: 0.7; }
      .sp-stage-item.done .sp-ico { background: var(--sp-accent); }
      /* 进行中：圆点放大 + 一圈 12% 晕（不是描边，是同色淡染） */
      .sp-stage-item.active { opacity: 1; color: var(--sp-ink); font-weight: 500; }
      .sp-stage-item.active .sp-ico {
        background: var(--sp-accent);
        transform: scale(1.15);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--sp-accent) 14%, transparent);
      }

      /* ── Footer ── */
      .sp-footer {
        position: absolute; bottom: 18px; left: 0; right: 0;
        text-align: center; font-size: 10.5px; letter-spacing: 0.14em;
        color: var(--sp-ink-soft); text-transform: uppercase; z-index: 1;
      }

      /* ── Keyframes ── */
      @keyframes sp-fade-up {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      /* 环自绘：dashoffset 从满到 0 —— 只动 stroke 属性，不触发布局。 */
      @keyframes sp-draw {
        to { stroke-dashoffset: 0; }
      }
      /* 墨点落纸：0.6 → 1，overshoot 到 1.04 再回落（手写的缓动曲线里
         带一点点回压，比线性放大更像「落下」而不是「弹出」）。 */
      @keyframes sp-drop {
        0%   { transform: scale(0.6); opacity: 0; }
        60%  { transform: scale(1.04); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          transition-duration: 0.15s !important;
        }
        .sp-mark, .sp-title, .sp-desc, .sp-progress-wrap, .sp-stages {
          opacity: 1 !important; transform: none !important;
        }
        .sp-mark-ring { stroke-dashoffset: 0 !important; }
        .sp-mark-drop, .sp-mark-shadow { transform: none !important; opacity: 1 !important; }
      }
    </style>
  </head>
  <body>
    <!-- React 挂载点。splash 必须是 body 的直接子节点而非 #root 内部——
         createRoot(#root).render() 会清空容器内所有现有子节点，
         splash 放在里面活不过 React 首帧（进度状态机因此全部空转）。 -->
    <div id="root"></div>

    <div id="splash" role="status" aria-label="Hermix Desktop 正在启动">
      <div class="sp-titlebar" aria-hidden="true"></div>

      <div class="sp-win-controls">
        <button class="sp-win-btn" id="sp-minimize" type="button" title="最小化" aria-label="最小化">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M2 6h8" />
          </svg>
        </button>
        <button class="sp-win-btn sp-close" id="sp-close" type="button" title="关闭" aria-label="关闭">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M2.5 2.5l7 7M9.5 2.5l-7 7" />
          </svg>
        </button>
      </div>

      <div class="sp-stage">
        <!-- 墨点落纸：纯矢量，不依赖任何外部资源（位图要等一次往返，
             慢时会先闪一个空格子）。造型与应用的「墨与纸」语言同源。 -->
        <div class="sp-mark" aria-hidden="true">
          <svg viewBox="0 0 88 88">
            <circle class="sp-mark-ring" cx="44" cy="44" r="35" />
            <!-- 淡影：墨点下方 14% 同色，给扁平造型一点厚度 -->
            <ellipse class="sp-mark-shadow" cx="44" cy="60" rx="9" ry="3.5" />
            <!-- 墨滴：上尖下圆 -->
            <path class="sp-mark-drop"
              d="M44 22c7.2 8.4 12 15.1 12 21.2C56 50.4 50.6 56 44 56s-12-5.6-12-12.8C32 37.1 36.8 30.4 44 22z" />
          </svg>
        </div>

        <div class="sp-title">Hermix <span class="sp-title-dim">Desktop</span></div>
        <div class="sp-desc">正在准备本地环境，完成后自动进入主界面。</div>

        <div class="sp-progress-wrap">
          <div class="sp-progress-track">
            <div class="sp-progress-bar" id="sp-progress-bar"></div>
          </div>
          <div class="sp-progress-meta">
            <span id="sp-progress-text">正在准备运行环境</span>
            <span class="sp-pct"><span id="sp-progress-pct">0</span><span class="sp-pct-sign">%</span></span>
          </div>
        </div>

        <div class="sp-stages" id="sp-stages">
          <div class="sp-stage-item active" data-i="0"><span class="sp-ico"></span><span class="sp-label">准备运行环境</span></div>
          <div class="sp-stage-item" data-i="1"><span class="sp-ico"></span><span class="sp-label">加载内置能力</span></div>
          <div class="sp-stage-item" data-i="2"><span class="sp-ico"></span><span class="sp-label">启动本地服务</span></div>
          <div class="sp-stage-item" data-i="3"><span class="sp-ico"></span><span class="sp-label">准备就绪</span></div>
        </div>
      </div>

      <div class="sp-footer">Hermix Desktop · Local-first AI</div>
    </div>

    <!-- 截图覆盖窗（data-overlay）的 React 前占位：黑底 + 「正在截取屏幕…」，
         主窗里 display:none。React 挂载后由 ScreenshotOverlay 移除。 -->
    <div id="overlay-boot">正在截取屏幕…</div>

    <!-- 启动状态由 /src/main.tsx 驱动: 走 stdio bridge 探活, 并按
         hermix:boot-stage 事件刷新阶段文案。此处不再内联 HTTP 轮询
         —— stdio 模式没有 HTTP 服务, 内联 fetch 必然全部失败。 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
