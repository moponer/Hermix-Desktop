  --color-accent: #fafafa;

  --color-border-primary: #3f3f46;

* { box-sizing: border-box; }
body {

  color: var(--color-text-primary);

  line-height: 1.55;

a { color: var(--color-accent); text-decoration: underline; text-underline-offset: 2px; }

.app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
.sidebar {

  background: var(--color-bg-secondary);
  padding: 18px 14px;
  overflow-y: auto;
}
.sidebar h2 { font-size: 11.5px; font-weight: 600; color: var(--color-text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin: 16px 0 6px; }
.sidebar h2:first-child { margin-top: 0; }
.sidebar .group { display: flex; flex-direction: column; gap: 2px; }
.sidebar .case {
  display: block; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
  color: var(--color-text-secondary); background: transparent; border: 0; text-align: left;
  font-family: inherit;
}
.sidebar .case:hover { background: var(--color-bg-tertiary); color: var(--color-text-primary); }
.sidebar .case.active { background: var(--color-accent-soft-strong); color: var(--color-text-primary); font-weight: 500; }
.sidebar .case .tag { float: right; font-size: 10px; color: var(--color-text-faint); font-family: ui-monospace, monospace; }
.theme-toggle { position: fixed; top: 12px; right: 12px; z-index: 10; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--color-border-primary); background: var(--color-bg-primary); color: var(--color-text-primary); cursor: pointer; font-family: inherit; font-size: 12px; }

.main { padding: 24px 32px; max-width: 920px; width: 100%; }
.main h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
.main .sub { color: var(--color-text-faint); font-size: 12px; margin: 0 0 18px; font-family: ui-monospace, monospace; }

/* ═══ MessageBubble 关键样式 (与 components.css 同步) ═══ */
.h-enter { animation: h-enter 240ms ease-out; }
@keyframes h-enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.h-tiny { font-size: 11.5px; color: var(--color-text-faint); }
.h-meta { font-size: 12px; color: var(--color-text-faint); font-style: italic; }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 500; padding: 1.5px 6px; border-radius: var(--radius-full);
}
.pill-success { background: rgba(16,185,129,.12); color: var(--color-success); }
.pill-warning { background: rgba(245,158,11,.12); color: var(--color-warning); }
.pill-error { background: rgba(239,68,68,.12); color: var(--color-error); }
.pill-info { background: rgba(59,130,246,.12); color: var(--color-info); }
.pill-muted { background: var(--color-bg-tertiary); color: var(--color-text-faint); }

.prose { font-size: 13.5px; line-height: 1.6; color: var(--color-text-primary); }
.prose p { margin: 0 0 0.35em; }
.prose p:last-child { margin-bottom: 0; }
.prose strong { color: var(--color-text-primary); font-weight: 600; }
.prose em { font-style: italic; color: var(--color-text-secondary); }
.prose code { font-family: ui-monospace, "Cascadia Code", monospace; font-size: 12px; background: var(--color-bg-tertiary); padding: 1px 5px; border-radius: 4px; }
.prose pre { background: var(--color-bg-code); color: var(--color-text-on-code); padding: 12px 16px; border-radius: var(--radius-md); overflow-x: auto; font-size: 12.5px; }
.prose h1, .prose h2, .prose h3 { font-weight: 600; margin: 0.6em 0 0.3em; }
.prose h1 { font-size: 1.42em; } .prose h2 { font-size: 1.22em; } .prose h3 { font-size: 1.08em; }
.prose ul, .prose ol { padding-left: 1.3em; margin: 0.3em 0; }
.prose li { margin: 0.1em 0; }
.prose li::marker { color: var(--color-text-faint); }

.msg-card + .msg-card { margin-top: 20px; }
.msg-bubble-user {
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-lg);
  padding: 10px 14px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--color-text-primary);
  max-width: 80%;
}
.msg-stack { display: flex; flex-direction: column; }
.msg-channel { margin-top: 14px; }
.msg-channel:first-child { margin-top: 0; }

.channel-label {

  padding: 2px 8px 2px 6px; border-radius: var(--radius-full);
  font-size: 10.5px; font-weight: 500;
  color: var(--color-text-muted);
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border-subtle);
}
.channel-label-count { font-family: ui-monospace, monospace; font-size: 10px; color: var(--color-text-faint); margin-left: auto; }

.tasks-block { border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); background: var(--color-bg-primary); overflow: hidden; }
.tasks-progress { height: 2px; background: var(--color-bg-tertiary); overflow: hidden; }
.tasks-progress-bar { height: 100%; background: var(--color-success); }
.tasks-header { display: flex; align-items: center; gap: 6px; padding: 10px 12px 0; font-size: 10.5px; font-weight: 500; color: var(--color-text-muted); }
.tasks-header-count { font-family: ui-monospace, monospace; font-size: 10px; color: var(--color-text-faint); margin-left: auto; }
.tasks-list { padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 4px; }
.task-row { display: flex; align-items: flex-start; gap: 8px; padding: 2px 0; font-size: 12.5px; line-height: 1.5; color: var(--color-text-primary); }
.task-row.done { color: var(--color-text-muted); }
.task-row.done .task-text { text-decoration: line-through; text-decoration-color: var(--color-text-faint); }

.tool-rail { position: relative; padding-left: 16px; }
.tool-rail::before { content: ""; position: absolute; left: 4px; top: 4px; bottom: 4px; width: 1.5px; background: var(--color-border-subtle); }
.tool-row { position: relative; margin-bottom: 2px; padding: 1px 0; }
.tool-row .rail-dot { position: absolute; left: -16px; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--color-text-faint); }
.tool-row.tool-done .rail-dot { background: var(--color-success); }
.tool-row.tool-error .rail-dot { background: var(--color-error); }
.tool-row.tool-running .rail-dot { background: var(--color-warning); }
.tool-head { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px; background: transparent; border: 0; cursor: pointer; font-family: inherit; font-size: 12px; color: var(--color-text-primary); width: 100%; text-align: left; }

.tool-name { font-family: ui-monospace, monospace; font-size: 12px; }
.tool-body { padding: 4px 8px 8px 8px; }

.status-note { display: flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 11.5px; color: var(--color-text-faint); }

.muted-block { padding: 12px 16px; font-size: 12px; color: var(--color-text-faint); font-style: italic; background: var(--color-bg-secondary); border-radius: var(--radius-md); }

.card-icon-block { flex-shrink: 0; margin-top: 2px; width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.card-body { flex: 1; min-width: 0; }
.card-args { font-size: 12px; line-height: 1.55; font-family: ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; border-radius: 6px; background: var(--color-bg-tertiary); padding: 8px 12px; max-height: 160px; overflow: auto; color: var(--color-text-secondary); margin: 0; }
.action-row { display: flex; align-items: center; gap: 8px; }
.btn-allow { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--color-accent); color: var(--color-accent-on-text); border: 0; cursor: pointer; font-family: inherit; }
.btn-deny { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--color-bg-tertiary); color: var(--color-text-primary); border: 1px solid var(--color-border-primary); cursor: pointer; font-family: inherit; }
.choice-chip { padding: 5px 10px; border-radius: 6px; font-size: 12px; background: var(--color-bg-tertiary); color: var(--color-text-primary); border: 1px solid var(--color-border-primary); cursor: pointer; font-family: inherit; }
.clarify-input { flex: 1; padding: 6px 10px; border-radius: 6px; font-size: 12.5px; outline: none; background: var(--color-bg-tertiary); color: var(--color-text-primary); border: 1px solid var(--color-border-primary); font-family: inherit; }
.btn-submit { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--color-accent); color: var(--color-accent-on-text); border: 0; cursor: pointer; font-family: inherit; }
.btn-submit:disabled { opacity: .3; cursor: not-allowed; }

/* ═══ Avatar (UserAvatar SVG inline) ═══ */
.avatar { display: inline-block; border-radius: 9999px; }

/* ═══ Bug annotations ═══ */
.bug-banner {
  background: rgba(239, 68, 68, 0.08);
  border: 1px solid rgba(239, 68, 68, 0.25);
  color: var(--color-error);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  margin: 12px 0;
  font-family: ui-monospace, monospace;
}
.bug-banner.warn {
  background: rgba(245, 158, 11, 0.08);
  border-color: rgba(245, 158, 11, 0.25);
  color: var(--color-warning);
}
.bug-banner strong { font-weight: 600; }
</style>

// 简单 markdown 渲染 (只支持我们测试用到的语法)
function md(s) {
  if (!s) return [];
  const lines = s.split('\n');
  return lines.map((line, i) => {
    // bold
    let html = line
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
    return { key: i, html, isList: /^\s*-\s+/.test(line), isHeading: /^#+\s+/.test(line), raw: line };
  });
}

function parseContent(content) {
  const lines = (content || '').split('\n');
  const result = { tasks: [], body: '' };
  let inTasks = false;
  const bodyLines = [];
  for (const line of lines) {
    if (line.startsWith('<tasks>')) { inTasks = true; continue; }
    if (line.startsWith('</tasks>')) { inTasks = false; continue; }
    if (inTasks) {
      const m = line.match(/^(.+?):\s*(.+)$/);
      if (m) result.tasks.push({ text: m[1] + ' → ' + m[2], done: false });
    } else {
      bodyLines.push(line);
    }
  }
  result.body = bodyLines.join('\n').trim();
  return result;
}

function riskVisual(risk) {
  const key = (risk || 'caution').toLowerCase();
  if (key === 'dangerous') return { Icon: I.ShieldAlert, iconClass: 'text-error', iconBg: 'rgba(239,68,68,.10)', pillLabel: '高危操作', pillClass: 'pill pill-error' };
  if (key === 'safe') return { Icon: I.ShieldCheck, iconClass: 'text-success', iconBg: 'rgba(16,185,129,.10)', pillLabel: '安全', pillClass: 'pill pill-success' };
  return { Icon: I.ShieldCheck, iconClass: 'text-warning', iconBg: 'rgba(245,158,11,.10)', pillLabel: '需确认', pillClass: 'pill pill-warning' };
}

function summarizeArgs(args) {
  if (args == null) return '（无参数）';
  if (typeof args === 'string') return args;
  try {
    const s = JSON.stringify(args, null, 2);
    return s.length > 600 ? s.slice(0, 600) + '\n…' : s;
  } catch { return String(args); }
}
