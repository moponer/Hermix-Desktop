[package]
name = "hermix-app-loader"
version = "0.1.0"
edition = "2021"
description = "Generic standalone WebView loader for Hermix custom apps (wry-based, capability-gated bridge)"

# 独立 workspace: 不并入宿主 hermix-desktop 根 workspace,
# 避免 `cargo build --workspace` 把 wry 拉进宿主构建.
[workspace]

[[bin]]
name = "hermix-app-loader"
path = "src/main.rs"

[[bin]]
name = "inject_app"
path = "src/inject_app.rs"

[dependencies]
# 与宿主 Tauri 同版本的 wry/tao，复用已编译产物，避免重编。
# wry 必须 default-features=false + 仅 Windows 相关 feature；
# os-webview/linux-body 内部的 webkit2gtk 依赖是 Linux target-gated，Windows 下为 no-op。
wry = { version = "0.55", default-features = false, features = ["protocol", "os-webview", "linux-body"] }
tao = "0.35"
rfd = { version = "0.16", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
