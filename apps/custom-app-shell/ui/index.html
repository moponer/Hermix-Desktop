<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义应用</title>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--app-bg, #1a1a2e);
            color: var(--app-text, #e0e0e0);
            min-height: 100vh;
        }
        #app-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #a0a0b0;
            font-size: 14px;
        }
        #app-error {
            display: none;
            padding: 24px;
            color: #f44336;
        }
        #app-error h2 { margin-bottom: 8px; font-size: 16px; }
        #app-error p { font-size: 13px; line-height: 1.6; word-break: break-all; }
        .spinner {
            width: 24px; height: 24px;
            border: 3px solid rgba(108, 99, 255, 0.2);
            border-top-color: #6c63ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app-loading">
        <div class="spinner"></div>
        <span>加载应用中...</span>
    </div>
    <div id="app-error">
        <h2>应用加载失败</h2>
        <p id="app-error-msg"></p>
    </div>
    <div id="app-root"></div>

    <script type="module">
        /**
         * App Loader — 壳的内置前端
         *
         * 职责:
         * 1. 通过 Tauri IPC 读取 resources/manifest.json（相对 fetch 在 app 协议下
         *    会命中嵌入资源 404，返回 index.html，导致 JSON 解析失败）
         * 2. 注入 CSS 变量 (设计系统)
         * 3. 通过 IPC 读取 resources/ui.bundle.js / backend.bundle.js，转成 Blob URL 后 import
         * 4. 挂载 backend 到全局
         * 5. 用 import map 提供的 React 渲染组件
         */

        // Tauri v2 内部桥接，壳内始终可用
        const invoke = typeof window !== "undefined" && window.__TAURI_INTERNALS__?.invoke;

        // 运行时冒烟测试支持: 把 JS 运行时错误 / 挂载结果上报给壳的 smoke_report IPC.
        // 仅在父进程以 HERMIX_SMOKE=1 启动壳时, 该 IPC 才会把事件写入日志文件.
        let __smokeReportedReady = false;
        function smokeReport(level, message) {
            if (!invoke) return;
            try {
                invoke("smoke_report", { level, message });
            } catch (_) { /* 正常模式无副作用 */ }
        }
        // 全局错误监听 — 尽早安装, 覆盖后续动态 import 与渲染期错误
        window.addEventListener("error", (e) => {
            const msg = e.error && e.error.stack ? e.error.stack : (e.message || String(e));
            smokeReport("error", "window.onerror: " + msg);
        });
        window.addEventListener("unhandledrejection", (e) => {
            const r = e.reason;
            const msg = (r && (r.stack || r.message)) ? (r.stack || r.message) : String(r);
            smokeReport("error", "unhandledrejection: " + msg);
        });

        async function readResourceText(path) {
            if (invoke) {
                try {
                    return await invoke("shell_fs_read", { path });
                } catch (e) {
                    console.warn("[app-loader] IPC 读取失败，回退到 fetch:", e);
                }
            }
            const r = await fetch(path);
            if (!r.ok) throw new Error(`资源加载失败 ${path} (${r.status})`);
            return r.text();
        }

        // Import map 的裸说明符 → 完整 URL 映射表。
        // Blob URL 创建的模块属于独立模块图，无法使用页面的 import map，
        // 因此需要在源码中将裸导入替换为完整 URL。
        const IMPORT_MAP = {
            "react": "https://esm.sh/react@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        };

        function rewriteBareImports(source) {
            // 第一步: 替换所有 import ... from "specifier"（含无空格 minified）。
            let result = source.replace(
                /(from\s*["'])([^"']+)(["'])/g,
                (match, prefix, specifier, suffix) => {
                    if (IMPORT_MAP[specifier]) {
                        return prefix + IMPORT_MAP[specifier] + suffix;
                    }
                    return match;
                }
            );

            // 第二步: 替换 side-effect import "specifier"（无 from，esbuild 可能产出）。
            // Blob URL 模块图不继承 import map，因此必须把裸说明符展开。
            result = result.replace(
                /(import\s*["'])([^"']+)(["'])/g,
                (match, prefix, specifier, suffix) => {
                    if (IMPORT_MAP[specifier]) {
                        return prefix + IMPORT_MAP[specifier] + suffix;
                    }
                    return match;
                }
            );

            // 第三步: 检测是否有 React 默认导入 (如 import React from "react")
            const hasReactDefault = /^\s*import\s+React\b/m.test(result);

            // 第四步: 检测是否使用了 React.createElement 但缺少默认导入。
            // esbuild classic JSX transform 会产出 React.createElement() 调用，
            // 但 --external:react 只保留了用户的命名导入 (如 { useState })，
            // 没有自动注入 React 默认导入。
            if (result.includes('React.createElement') && !hasReactDefault) {
                result = `import React from "${IMPORT_MAP["react"]}";\n` + result;
            }

            return result;
        }

        async function importResourceModule(path) {
            const source = await readResourceText(path);
            const rewritten = rewriteBareImports(source);
            const blob = new Blob([rewritten], { type: "text/javascript" });
            const url = URL.createObjectURL(blob);
            try {
                return await import(url);
            } finally {
                URL.revokeObjectURL(url);
            }
        }

        async function loadApp() {
            const loading = document.getElementById("app-loading");
            const errorDiv = document.getElementById("app-error");
            const errorMsg = document.getElementById("app-error-msg");
            const root = document.getElementById("app-root");

            try {
                // 1. 加载 manifest
                const manifestText = await readResourceText("resources/manifest.json");
                const manifest = JSON.parse(manifestText);

                // 2. 应用主题 (CSS 变量)
                if (manifest.theme) {
                    for (const [key, value] of Object.entries(manifest.theme)) {
                        document.documentElement.style.setProperty(key, value);
                    }
                }
                document.title = manifest.name || "自定义应用";

                // 3. 加载 backend bundle (挂载到全局)
                try {
                    const backendModule = await importResourceModule("resources/backend.bundle.js");
                    window.__APP_BACKEND__ = backendModule;
                } catch (e) {
                    console.warn("backend.bundle.js 加载失败 (应用可能不需要后端):", e);
                    window.__APP_BACKEND__ = { execute: async () => ({ success: false, error: "无后端" }) };
                }

                // 4. 加载 UI bundle
                const uiModule = await importResourceModule("resources/ui.bundle.js");
                const Component = uiModule.default;
                if (!Component) throw new Error("ui.bundle.js 未导出默认组件");

                // 5. 渲染（React 由 import map 从 esm.sh 提供，与 UI bundle 共用同一实例）
                loading.style.display = "none";
                const React = await import("react");
                const ReactDOM = await import("react-dom/client");
                ReactDOM.createRoot(root).render(React.createElement(Component));

                // 挂载检测: React 异步渲染, 稍后检查 app-root 是否产生了内容.
                // 同时捕获渲染期 / effect 内抛出的运行时错误 (会被上面的全局监听上报).
                setTimeout(() => {
                    if (root.childElementCount > 0) {
                        if (!__smokeReportedReady) {
                            __smokeReportedReady = true;
                            smokeReport("ready", "应用已挂载 (app-root 有内容)");
                        }
                    } else {
                        smokeReport("error", "白屏检测: 渲染后 app-root 在 1.5s 内仍为空 (组件可能初始返回 null 或抛错未捕获)");
                    }
                }, 1500);
            } catch (e) {
                loading.style.display = "none";
                errorDiv.style.display = "block";
                errorMsg.textContent = e instanceof Error ? `${e.message}\n${e.stack || ""}` : String(e);
                console.error("[app-loader] 加载失败:", e);
                smokeReport("error", "loadApp 失败: " + (e && e.stack ? e.stack : (e && e.message) || String(e)));
            }
        }

        loadApp();
    </script>
</body>
</html>
